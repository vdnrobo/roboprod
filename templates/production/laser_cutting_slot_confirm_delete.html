{% extends "base.html" %}

{% block title %}Удалить время резки{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Удалить время резки</h1>
  <p>Запись <strong>{{ slot }}</strong> будет удалена из расписания.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="danger-button" type="submit">Удалить</button>
    <a class="button" href="{% url 'info_panel' %}">Отмена</a>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Регистрация</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label>
        <span>{{ field.label }}</span>
        {{ field }}
        {{ field.errors }}
      </label>
    {% endfor %}
    <button class="primary" type="submit">Создать аккаунт</button>
  </form>
</section>
{% endblock %}

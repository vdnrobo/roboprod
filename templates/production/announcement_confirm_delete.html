{% extends "base.html" %}

{% block title %}Удалить объявление{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Удалить объявление</h1>
  <p>Объявление <strong>{{ announcement.title }}</strong> будет удалено.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="danger-button" type="submit">Удалить</button>
    <a class="button" href="{% url 'info_panel' %}">Отмена</a>
  </form>
</section>
{% endblock %}

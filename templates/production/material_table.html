<div class="table-wrap embedded">
  <table>
    <thead>
      <tr>
        <th>Название</th>
        <th>Цвет</th>
        <th>Статус</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      {% for material in materials %}
        <tr>
          <td>{{ material.name }}</td>
          <td>{{ material.color }}</td>
          <td>{% if material.is_active %}Активен{% else %}Отключен{% endif %}</td>
          <td>
            <div class="actions">
              <a href="{% url 'material_update' material.pk %}">Редактировать</a>
              <a class="danger-link" href="{% url 'material_delete' material.pk %}">Удалить</a>
            </div>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="4">Материалов нет.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% extends "base.html" %}

{% block title %}Удалить правило графика{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Удалить правило графика</h1>
  <p>Правило <strong>{{ rule }}</strong> будет удалено.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="danger-button" type="submit">Удалить</button>
    <a class="button" href="{% url 'duty_slot_list' %}">Отмена</a>
  </form>
</section>
{% endblock %}

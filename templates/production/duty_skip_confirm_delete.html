{% extends "base.html" %}

{% block title %}Удалить пропуск дежурства{% endblock %}

{% block content %}
<section class="panel narrow">
  <h1>Удалить пропуск дежурства</h1>
  <p>Запись <strong>{{ skip }}</strong> будет удалена из списка пропусков.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="danger-button" type="submit">Удалить</button>
    <a class="button" href="{% url 'duty_slot_list' %}">Отмена</a>
  </form>
</section>
{% endblock %}
